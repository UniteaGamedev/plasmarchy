# Plasmarchy screensaver (Omarchy-style: animated logo in a fullscreen terminal)
# The logo lives in ~/.config/plasmarchy/branding/screensaver.txt - change it with "plasmarchy branding"
# Minutes of idle time before it starts (0 = never automatically)
TIMEOUT_MIN=5
# Terminal font size - smaller = bigger canvas, smaller logo
FONT_SIZE=14
