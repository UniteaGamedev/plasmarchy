# AI assistant (also editable in the widget: robot icon -> menu -> Settings)
# Which AI answers first: auto | claude | cursor | codex | gemini | local
PROVIDER=auto
# Fallback chain on limits/errors (local model last, see "plasmarchy llm setup")
PROVIDER_ORDER="claude cursor codex gemini local"
LOCAL_MODEL=qwen3:4b
# Let the AI open apps and change theme and volume (only these commands): on | off
ACTIONS=off
# Notify when only this many percent of a Claude limit are left (several values possible, empty = off)
NOTIFY_LEFT="20 5"
# Voice (after "plasmarchy voice setup"): speech recognition model base | small | medium
VOICE_MODEL=small
# Language and voice follow the system language; override if needed:
# VOICE_LANG=en
# VOICE_TTS=en_US-ryan-medium
# Microphone (auto = pick the one with a real speech signal)
VOICE_SOURCE=auto
# Conversation hotkey
HOTKEY=Meta+Shift+Space
